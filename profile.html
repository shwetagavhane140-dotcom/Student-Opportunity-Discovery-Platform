<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="style.css">

</head>

<body>


<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">

    <div class="container">

        <a class="navbar-brand fw-bold brand" href="index.html">
            <i class="bi bi-compass-fill"></i> OpportunityHub
        </a>

        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="nav">

            <ul class="navbar-nav mx-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="opportunities.html">Explore</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="how-it-works.html">How It Works</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="dashboard.html">Dashboard</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="profile.html">My Profile</a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<section class="profile-section">

    <div class="container">

        <div class="page-title">

            <span class="small-title">STUDENT PROFILE</span>

            <h1>Tell us about yourself</h1>

            <p>
                Your profile helps us show opportunities that match your interests.
            </p>

        </div>


        <div class="profile-form-card">

            <form id="profileForm" onsubmit="saveProfile(event)">

                <div class="row g-4">

                    <div class="col-md-6">

                        <label>Full Name</label>

                        <input
                            type="text"
                            id="profileName"
                            class="form-control"
                            placeholder="Enter your name"
                            required
                        >

                    </div>


                    <div class="col-md-6">

                        <label>Email</label>

                        <input
                            type="email"
                            id="profileEmail"
                            class="form-control"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="col-md-6">

                        <label>Education</label>

                        <select id="education" class="form-control">

                            <option value="">Select education</option>

                            <option>Computer Engineering</option>
                            <option>Information Technology</option>
                            <option>Electronics Engineering</option>
                            <option>Mechanical Engineering</option>
                            <option>Other</option>

                        </select>

                    </div>


                    <div class="col-md-6">

                        <label>Year of Study</label>

                        <select id="year" class="form-control">

                            <option value="">Select year</option>

                            <option>First Year</option>
                            <option>Second Year</option>
                            <option>Third Year</option>
                            <option>Final Year</option>

                        </select>

                    </div>


                    <div class="col-12">

                        <label>Skills</label>

                        <input
                            type="text"
                            id="skills"
                            class="form-control"
                            placeholder="Example: Java, Python, HTML, AI"
                        >

                        <small>
                            Separate multiple skills with commas.
                        </small>

                    </div>


                    <div class="col-12">

                        <label>Interests</label>

                        <div class="interest-options">

                            <label class="interest-item">
                                <input type="checkbox" value="Internship">
                                Internships
                            </label>

                            <label class="interest-item">
                                <input type="checkbox" value="Hackathon">
                                Hackathons
                            </label>

                            <label class="interest-item">
                                <input type="checkbox" value="Course">
                                Courses
                            </label>

                            <label class="interest-item">
                                <input type="checkbox" value="Scholarship">
                                Scholarships
                            </label>

                            <label class="interest-item">
                                <input type="checkbox" value="Competition">
                                Competitions
                            </label>

                        </div>

                    </div>


                    <div class="col-12">

                        <button type="submit" class="btn btn-primary save-btn">

                            <i class="bi bi-check-circle"></i>
                            Save Profile

                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>

</section>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="script.js"></script>

</body>
</html>
